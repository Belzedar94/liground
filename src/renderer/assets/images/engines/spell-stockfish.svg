<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Spell-Stockfish">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d3d55"/>
      <stop offset="1" stop-color="#3a2560"/>
    </linearGradient>
    <linearGradient id="freeze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fd9f5"/>
      <stop offset="1" stop-color="#1f8dbe"/>
    </linearGradient>
    <linearGradient id="jump" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7aefc"/>
      <stop offset="1" stop-color="#7c4ddb"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- a pawn silhouette holding the middle, so it still reads as a chess engine -->
  <path d="M32 14a5 5 0 0 1 2.9 9.1c1.7 1 2.8 2.6 3 4.4h-11.8c.2-1.8 1.3-3.4 3-4.4A5 5 0 0 1 32 14z"
        fill="#e8eef5" opacity="0.9"/>
  <path d="M27.4 30h9.2c0 4.6-1.3 8.6-2.5 11.2h2.9c1.9 0 3.5 1.5 3.5 3.4v1.9H23.5v-1.9c0-1.9 1.6-3.4 3.5-3.4h2.9c-1.2-2.6-2.5-6.6-2.5-11.2z"
        fill="#e8eef5" opacity="0.9"/>

  <!-- freeze flask, left -->
  <g transform="translate(9.5 30) scale(0.72)">
    <path d="M6 2h7v6.4a10 10 0 1 1-7 0V2z" fill="url(#freeze)" stroke="#0d2b3c" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M9.5 12v9M5.6 14.4l7.8 4.5M13.4 14.4l-7.8 4.5" stroke="#eaf8ff" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- jump flask, right -->
  <g transform="translate(41.5 30) scale(0.72)">
    <path d="M6 2h7v6.4a10 10 0 1 1-7 0V2z" fill="url(#jump)" stroke="#2a1b4d" stroke-width="1.6" stroke-linejoin="round"/>
    <ellipse cx="9.5" cy="17.5" rx="6" ry="4.2" fill="none" stroke="#f0e8ff" stroke-width="1.6"/>
    <path d="M9.5 21.5v-8M6.7 16.3L9.5 13l2.8 3.3" fill="none" stroke="#f0e8ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
